api: lendis:content
summary: >-
  Lendis operates no developer program, so there is no API lifecycle policy of any kind: no
  published versioning policy, no deprecation policy, no Sunset header support, no SLA and no
  status page. The only versioning signal is the WordPress namespace in the URI path. Because
  neither a status page nor a deprecation policy exists, this repo deliberately does NOT emit
  apis.yml StatusPage or Deprecation pointers.
versioning:
  scheme: uri-path-namespace
  current: wp/v2
  base: https://www.lendis.io/wp-json
  policy_url: null
  note: Inherited from WordPress core rather than governed by Lendis. The namespace has been
    wp/v2 since WordPress 4.7 (2016). Plugin-contributed namespaces on this deployment
    (jet-engine/v1, rankmath/v1, weglot/v1 and others) carry their own vendor versioning.
  discovery: GET https://www.lendis.io/wp-json/ lists every registered namespace; GET
    https://www.lendis.io/wp-json/wp/v2 returns the full route index.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: No RFC 8594 Sunset or Deprecation headers were observed on live responses, and no
    deprecation policy is published.
deprecated_operations: []
sla:
