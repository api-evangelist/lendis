platform_note: >-
  Lendis' commercial platform (LendisOS at app.lendis.io) is backed by a private AWS API Gateway
  at api.lendis.io which answers every path with HTTP 403 "Missing Authentication Token". It has
  no public routes, no documentation and no announced lifecycle. If Lendis ever opens that API,
  this artifact is where the real policy would land.
