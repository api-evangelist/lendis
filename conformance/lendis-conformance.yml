standards:
- id: openapi-3.1
  conforms: true
  evidence: openapi/lendis-content-openapi.yml is OpenAPI 3.1.0, derived by API Evangelist from
    the API's own live route index. Lendis publishes no OpenAPI itself.
  authored_by: api-evangelist
- id: rest
  conforms: true
  evidence: Resource-oriented URIs, HTTP verb semantics, JSON representations, HTTP status codes.
- id: hal-style-links
  conforms: partial
  evidence: Every object carries a _links object with self, collection, about, author, wp:term
    and wp:featuredmedia relations, and _embed inlines them into _embedded. This follows the
    WordPress REST convention, which is HAL-influenced but not conformant HAL (no application/hal+json
    media type).
- id: rfc8288-web-linking
  conforms: true
  evidence: 'Collection responses return a Link header with rel="next" / rel="prev" - observed
    live on GET /wp/v2/posts?per_page=2.'
- id: rfc9457-problem-details
  conforms: false
  evidence: Errors are served as application/json with the WordPress envelope
    {code, message, data.status}, not application/problem+json. See errors/lendis-problem-types.yml.
- id: pagination
  conforms: true
  evidence: page / per_page query parameters with X-WP-Total and X-WP-TotalPages response
    headers plus RFC 8288 Link navigation.
- id: idempotency
  conforms: false
  evidence: No Idempotency-Key header, no deduplication window and no retry-safety contract.
    Only HTTP method semantics apply.
- id: oauth2
  conforms: false
  evidence: No oauth2 securityScheme in the spec and no OAuth documentation. Authentication is
    HTTP Basic with a WordPress Application Password, or an X-WP-Nonce cookie nonce.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on www.lendis.io. The 200 on
    app.lendis.io is a single-page-application HTML fallback, not an OIDC discovery document.
- id: rfc9116-security-txt
