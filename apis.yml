aid: lendis
name: Lendis
description: 'Lendis GmbH is a Berlin-based B2B technology company, founded in 2018, that rents IT hardware
  to German small and mid-sized businesses under a Device-as-a-Service (DaaS) model. Lendis bundles hardware
  procurement, configuration and staging, delivery logistics, financing, IT support, lifecycle management
  and device offboarding into a single monthly rental rate, and manages the whole estate through LendisOS,
  a web platform covering a self-service shop, order tracking, asset inventory and contract management.
  The company targets organisations of roughly 50 to 500 employees that want to avoid tying up capital in
  laptops, smartphones, monitors and accessories. Lendis publishes no public developer program; its
  commercial platform runs on a private AWS API Gateway at api.lendis.io. Its marketing site does expose
  a public read-only WordPress REST content API, and Lendis publishes a machine-readable llms.txt for AI
  agents.'
